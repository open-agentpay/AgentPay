version: "3.8"

# ==============================================================================
# AgentPay Production Compose Specification with Caddy Edge Gateway
# Uses `caddy:alpine` as the unified reverse proxy with automatic SSL/TLS.
#
# Usage:
#   docker compose -f docker-compose.caddy.yml up -d
# ==============================================================================

services:
  # ==============================================================================
  # 0. Edge Gateway & SSL Reverse Proxy (Caddy)
  # Automatically obtains and renews HTTPS certificates from Let's Encrypt / ZeroSSL
  # ==============================================================================
  caddy:
    image: caddy:alpine
    container_name: agentpay-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 Support
    environment:
      DOMAIN_MARKETPLACE: ${DOMAIN_MARKETPLACE:-aipmedia.cn}
      DOMAIN_CONSOLE: ${DOMAIN_CONSOLE:-console.aipmedia.cn}
      DOMAIN_GATEWAY: ${DOMAIN_GATEWAY:-gate.aipmedia.cn}
      DOMAIN_FACILITATOR: ${DOMAIN_FACILITATOR:-facilitator.aipmedia.cn}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # Crucial: persists SSL certificates & keys
      - caddy_config:/config  # Persists dynamic Caddy runtime state
    depends_on:
      - gateway
      - console
      - marketplace
    networks:
      - agentpay-net

  # ==============================================================================
  # 1. PostgreSQL 15 Database (Relational Store)
  # ==============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: agentpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentpay}
      POSTGRES_USER: ${POSTGRES_USER:-agentpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Bound only to local loopback interface for host maintenance; not exposed to public
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentpay-net

  # ==============================================================================
  # 2. AgentPay Go Gateway Service (Core Payment Proxy & Admin API)
  # ==============================================================================
  gateway:
    image: ${DOCKER_REGISTRY:-openagentpay}/gateway:${IMAGE_TAG:-latest}
    container_name: agentpay-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/gateway/configs/gateway.example.yaml:/etc/agentpay/gateway.yaml:ro
    environment:
      AGENTPAY_HOST: "0.0.0.0"
      AGENTPAY_PORT: 8000
      AGENTPAY_POSTGRES_URL: "postgres://${POSTGRES_USER:-agentpay}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-agentpay}?sslmode=disable"
      AGENTPAY_JWT_SECRET: ${AGENTPAY_JWT_SECRET:?AGENTPAY_JWT_SECRET must be set}
      AGENTPAY_UPSTREAM_MASTER_KEY: ${AGENTPAY_UPSTREAM_MASTER_KEY:?AGENTPAY_UPSTREAM_MASTER_KEY must be set}
      AGENTPAY_FACILITATOR_API_KEY: ${AGENTPAY_FACILITATOR_API_KEY:-}
      AGENTPAY_LOG_LEVEL: ${LOG_LEVEL:-info}
      AGENTPAY_LOG_FORMAT: "json"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - agentpay-net

  # ==============================================================================
  # 3. AgentPay Console (Web Dashboard: Vue 3 + Vite)
  # ==============================================================================
  console:
    image: ${DOCKER_REGISTRY:-openagentpay}/console:${IMAGE_TAG:-latest}
    container_name: agentpay-console
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - agentpay-net

  # ==============================================================================
  # 4. AgentPay Marketplace Web (Storefront & GEO Portal: Next.js 15)
  # ==============================================================================
  marketplace:
    image: ${DOCKER_REGISTRY:-openagentpay}/marketplace:${IMAGE_TAG:-latest}
    container_name: agentpay-marketplace
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=256"
      GATEWAY_INTERNAL_URL: http://gateway:8000
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-https://gate.openagentpay.dev}
      NEXT_PUBLIC_CONSOLE_URL: ${NEXT_PUBLIC_CONSOLE_URL:-https://console.openagentpay.dev}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://openagentpay.dev}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - agentpay-net

  # ==============================================================================
  # 5. AgentPay Facilitator Node (EIP-712 Verification & On-Chain Settlement)
  # [Optional / Blockchain] Domestic servers do not need this; activated only via:
  #   docker compose -f docker-compose.caddy.yml --profile blockchain up -d
  # ==============================================================================
  facilitator:
    profiles:
      - blockchain
    image: ${DOCKER_REGISTRY:-openagentpay}/facilitator:${IMAGE_TAG:-latest}
    container_name: agentpay-facilitator
    restart: unless-stopped
    environment:
      FACILITATOR_HOST: "0.0.0.0"
      FACILITATOR_PORT: 8001
      RPC_URL: ${RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
      CHAIN_ID: ${CHAIN_ID:-421614}
      USDC_ADDRESS: ${USDC_ADDRESS:-0x75faf114eafb1BDbe2F0316DF893fd58CE46AA4d}
      FACILITATOR_PRIVATE_KEY: ${FACILITATOR_PRIVATE_KEY:-}
      FACILITATOR_API_KEY: ${FACILITATOR_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8001/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - agentpay-net

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  agentpay-net:
    driver: bridge
