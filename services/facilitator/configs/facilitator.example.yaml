# ==============================================================================
# AgentPay Go Facilitator Node Configuration (v1.0.0)
# ==============================================================================

version: "1.0.0"

server:
  host: "0.0.0.0"
  port: 8001

security:
  # API key required by Facilitator to accept verify and settle requests
  api_key: "agentpay_facilitator_secret_key_change_in_prod"
  # Allowed payees whitelist. If non-empty, only these addresses are permitted as payees.
  allowed_payees:
    - "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
  # Minimum gas threshold in wei (0.001 ETH default)
  min_gas_balance_wei: "1000000000000000"

evm:
  # EVM JSON-RPC URL (defaults to Arbitrum Sepolia; override via RPC_URL env var)
  rpc_url: "https://sepolia-rollup.arbitrum.io/rpc"

  # Target network chain ID (Arbitrum Sepolia = 421614; Base Sepolia = 84532)
  chain_id: 421614

  # Circle USDC Token Contract on Arbitrum Sepolia
  token_address: "0xa0B4Af0A1Fa90708a33eB127B6963a902020d2Ed"

  # Facilitator private key for Gas sponsorship and EIP-3009 transfer broadcasting.
  # Leave blank for development/mock mode, or configure via FACILITATOR_PRIVATE_KEY.
  private_key: ""

  # Automatically poll transaction receipts for confirmation
  auto_poll_receipts: true

logger:
  level: "info"
  format: "json"
