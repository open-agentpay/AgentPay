[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpay-gateway"
version = "0.1.0"
description = "AgentPay Reverse Proxy & Seller Gateway for Autonomous Agent Micro-Payments"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "AgentPay Contributors" }
]
requires-python = ">=3.10"
keywords = ["agent", "ai", "x402", "gateway", "reverse-proxy", "usdc", "eip-712", "arbitrum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
]
dependencies = [
    "open-agentpay>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[project.urls]
Homepage = "https://github.com/july-whj/AgentPay"
Documentation = "https://github.com/july-whj/AgentPay/blob/main/specs/gateway-guide.md"
Repository = "https://github.com/july-whj/AgentPay"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpay_gateway"]
