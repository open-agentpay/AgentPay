[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpay-gateway"
version = "0.1.0"
description = "AgentPay Reverse Proxy & Seller Gateway for Autonomous Agent Micro-Payments"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "AgentPay Contributors" }
]
requires-python = ">=3.10"
dependencies = [
    "agentpay>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentpay_gateway"]
