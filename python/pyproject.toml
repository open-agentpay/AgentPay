[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpay"
version = "0.2.4"
description = "The Open-Source Payment Infrastructure & Financial Firewall for Autonomous AI Agents"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "AgentPay Contributors" }
]
requires-python = ">=3.10"
keywords = ["agent", "ai", "llm", "x402", "usdc", "eip-712", "financial-firewall", "arbitrum", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "eth-account>=0.11.0",
    "web3>=6.15.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0"
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110.0"
]
langchain = [
    "langchain-core>=0.1.0"
]
all = [
    "fastapi>=0.110.0",
    "langchain-core>=0.1.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[project.urls]
Homepage = "https://openagentpay.dev/"
Documentation = "https://openagentpay.dev/"
Repository = "https://github.com/open-agentpay/AgentPay"

[tool.hatch.build.targets.wheel]
packages = ["packages/agentpay/src/agentpay"]

[tool.pytest.ini_options]
pythonpath = [
    "packages/agentpay/src",
    "packages/agentpay-gateway/src",
    "."
]
testpaths = ["tests"]
