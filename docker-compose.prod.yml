version: "3.8"

# ==============================================================================
# AgentPay Production Cloud Deployment Compose Specification
# Use this file on cloud servers to run pre-built container images directly:
#   docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: agentpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentpay}
      POSTGRES_USER: ${POSTGRES_USER:-agentpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentpay_strong_password_change_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentpay-net

  gateway:
    image: ${DOCKER_REGISTRY:-openagentpay}/gateway:${IMAGE_TAG:-latest}
    container_name: agentpay-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./gateway-go/configs/gateway.yaml:/etc/agentpay/gateway.yaml:ro
    environment:
      AGENTPAY_HOST: "0.0.0.0"
      AGENTPAY_PORT: 8000
      AGENTPAY_POSTGRES_URL: "postgres://${POSTGRES_USER:-agentpay}:${POSTGRES_PASSWORD:-agentpay_strong_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-agentpay}?sslmode=disable"
      AGENTPAY_JWT_SECRET: ${AGENTPAY_JWT_SECRET:-agentpay-super-secret-production-jwt-key-32chars!}
      AGENTPAY_LOG_LEVEL: ${LOG_LEVEL:-info}
      AGENTPAY_LOG_FORMAT: "json"
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - agentpay-net

  console:
    image: ${DOCKER_REGISTRY:-openagentpay}/console:${IMAGE_TAG:-latest}
    container_name: agentpay-console
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${CONSOLE_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - agentpay-net

volumes:
  postgres_data:
    driver: local

networks:
  agentpay-net:
    driver: bridge
